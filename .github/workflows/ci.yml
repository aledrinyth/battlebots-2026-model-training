name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * *"  # nightly ~01:00 AEST — adds the P4.4 full compliance gate

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with vendored engine submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Build bot venv (v2 deps: numpy + pinned engine + wasmtime)"
        run: |
          python -m venv .venv-bot
          .venv-bot/bin/pip install --upgrade pip
          .venv-bot/bin/pip install -r requirements-bot-v2.txt

      - name: Build wasm module (gate G0)
        run: make wasm

      - name: CI gate — import-linter + tests + vendored engine suite + compliance smoke
        run: make ci-full

      - name: Nightly — P4.4 full compliance (10 full-length games, all checks)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: make compliance-full
