name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with vendored engine submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Build bot venv (v2 deps: numpy + pinned engine + wasmtime)"
        run: |
          python -m venv .venv-bot
          .venv-bot/bin/pip install --upgrade pip
          .venv-bot/bin/pip install -r requirements-bot-v2.txt

      - name: Build wasm module (gate G0)
        run: make wasm

      - name: CI gate — import-linter + tests + vendored engine suite
        run: make ci-full
